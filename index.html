<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te Amo Carol</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #1a080d 0%, #4a0e17 50%, #1a080d 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ff4d6d;
      text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
      margin-top: 10px;
    }

    .heart-icon {
      font-size: 1.5rem;
      animation: heartbeat 1.2s infinite;
      display: inline-block;
      margin: 0 5px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Carrossel */
    .carousel-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 77, 109, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: #000;
    }

    .carousel-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-slide.active {
      opacity: 1;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Indicadores */
    .dots-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #ff4d6d;
      width: 20px;
      border-radius: 10px;
    }

    /* Player de áudio e Overlay para iOS */
    .audio-control {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 5, 8, 0.95);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-btn {
      margin-top: 20px;
      padding: 15px 30px;
      background: #ff4d6d;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
    }

    /* Player invisível do YouTube */
    #yt-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Tela inicial para liberar o áudio no iPhone/Navegadores -->
  <div id="start-overlay" onclick="startExperience()">
    <h2><span class="heart-icon">❤️</span> Para Você Carol <span class="heart-icon">❤️</span></h2>
    <button class="start-btn">Toque para Abrir</button>
  </div>

  <div class="container">
    <h1>TE AMO CAROL <span class="heart-icon">❤️</span></h1>

    <div class="carousel-container" id="carousel">
      <!-- As imagens da pasta local serão inseridas via JavaScript -->
    </div>

    <div class="dots-container" id="dots"></div>

    <div class="audio-control" onclick="toggleAudio()">
      <span id="audio-icon">🎵</span>
      <span id="audio-status">BK' - Planos</span>
    </div>
  </div>

  <!-- Player de Vídeo Oculto do YouTube -->
  <div id="yt-player"></div>

  <script>
    // Nomes das fotos salvas na MESMA PASTA do index.html
    const images = [
      'foto1.jpg',
      'foto2.jpg',
      'foto3.jpg',
      'foto4.jpg',
      'foto5.jpg',
      'foto6.jpg',
      'foto7.jpg',
      'foto8.jpg'
    ];

    const carousel = document.getElementById('carousel');
    const dotsContainer = document.getElementById('dots');
    let currentIndex = 0;

    // Criar os slides do carrossel
    images.forEach((src, index) => {
      const slide = document.createElement('div');
      slide.classList.add('carousel-slide');
      if (index === 0) slide.classList.add('active');

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Foto ${index + 1}`;
      
      slide.appendChild(img);
      carousel.appendChild(slide);

      // Criar pontinhos navegadores
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dotsContainer.appendChild(dot);
    });

    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');

    function nextSlide() {
      slides[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      
      currentIndex = (currentIndex + 1) % slides.length;
      
      slides[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    }

    // Passa a foto a cada 3.5 segundos
    setInterval(nextSlide, 3500);

    // Integromos a API de áudio do YouTube para "BK - Planos"
    let player;
    let isPlaying = false;

    // Carrega a API de Iframe do YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: 'm8eO2E9qO9I', // ID do vídeo da música "BK' - Planos"
        playerVars: {
          'playsinline': 1,
          'loop': 1,
          'playlist': 'm8eO2E9qO9I'
        }
      });
    }

    function startExperience() {
      document.getElementById('start-overlay').classList.add('hidden');
      if (player && player.playVideo) {
        player.playVideo();
        isPlaying = true;
      }
    }

    function toggleAudio() {
      const statusText = document.getElementById('audio-status');
      const icon = document.getElementById('audio-icon');

      if (!player) return;

      if (isPlaying) {
        player.pauseVideo();
        isPlaying = false;
        statusText.innerText = "Música pausada";
        icon.innerText = "🔇";
      } else {
        player.playVideo();
        isPlaying = true;
        statusText.innerText = "BK' - Planos";
        icon.innerText = "🎵";
      }
    }
  </script>
</body>
</html>
