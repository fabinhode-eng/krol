
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#300811">
  <title>Te Amo Carol</title>

  <!-- Fonte romântica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(
        135deg,
        #1a080d 0%,
        #4a0e17 50%,
        #1a080d 100%
      );
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 25px 15px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    /* Mensagem romântica */
    h1 {
      font-family: "Dancing Script", "Brush Script MT", cursive;
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.2;
      color: #ff8fa3;
      text-shadow:
        0 0 10px rgba(255, 77, 109, 0.6),
        0 0 25px rgba(255, 77, 109, 0.3);
      margin-top: 10px;
    }

    .heart-icon {
      font-size: 1.3rem;
      display: inline-block;
      animation: heartbeat 1.2s infinite;
      vertical-align: middle;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Carrossel */
    .carousel-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(255, 77, 109, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: #000;
    }

    .carousel-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-slide.active {
      opacity: 1;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Indicadores */
    .dots-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #ff8fa3;
      width: 20px;
      border-radius: 10px;
    }

    /* Botão de música */
    .audio-control {
      margin-top: 2px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
      transition: transform 0.2s, background 0.2s;
      position: relative;
      z-index: 3;
    }

    .audio-control:active {
      transform: scale(0.92);
    }

    .audio-control:focus-visible {
      outline: 2px solid #ff8fa3;
      outline-offset: 4px;
    }

    /* Corações flutuantes */
    #hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      opacity: 0;
      animation: float-up linear infinite;
      will-change: transform, opacity;
      user-select: none;
      filter: drop-shadow(0 0 5px rgba(255, 77, 109, 0.3));
    }

    @keyframes float-up {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 0.75;
      }
      80% {
        opacity: 0.65;
      }
      100% {
        transform: translate3d(35px, -115vh, 0) rotate(35deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Ondas geradas pelos toques */
    .tap-wave {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 143, 163, 0.95);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 9998;
      animation: wave-expand 0.8s ease-out forwards;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.3);
    }

    @keyframes wave-expand {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(5);
        opacity: 0;
      }
    }

    /* Emojis que flutuam e desaparecem */
    .tap-emoji {
      position: fixed;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      font-size: 30px;
      line-height: 1;
      animation: emoji-float-fade 1.35s ease-out forwards;
      filter: drop-shadow(0 2px 5px rgba(255, 77, 109, 0.25));
      will-change: transform, opacity;
    }

    @keyframes emoji-float-fade {
      0% {
        opacity: 0;
        transform: translate(-50%, -35%) scale(0.35) rotate(-12deg);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -65%) scale(1.2) rotate(8deg);
      }
      35% {
        transform: translate(-50%, -75%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -155%) scale(0.75) rotate(12deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-heart {
        animation-duration: 20s !important;
      }

      .carousel-slide {
        transition-duration: 0.3s;
      }

      .tap-wave,
      .tap-emoji {
        animation-duration: 0.4s;
      }
    }
  </style>
</head>

<body>

  <!-- Corações decorativos -->
  <div id="hearts" aria-hidden="true"></div>

  <main class="container">

    <h1>
      Te amo, Carol
      <span class="heart-icon">❤️</span>
    </h1>

    <div class="carousel-container" id="carousel">
      <!-- As fotos são inseridas pelo JavaScript -->
    </div>

    <div class="dots-container" id="dots"></div>

    <!-- Botão discreto, sem nome da música -->
    <button
      class="audio-control"
      id="audio-button"
      type="button"
      aria-label="Tocar música"
      title="Tocar ou pausar música"
    >
      <span id="audio-icon" aria-hidden="true">🎵</span>
    </button>

  </main>

  <!-- Arquivo de áudio na mesma pasta do index.html -->
  <audio
    id="musica"
    src="planos.mp3"
    autoplay
    loop
    preload="auto"
    playsinline
  ></audio>

  <script>
    // ==========================================
    // 1. FOTOS DO CARROSSEL
    // ==========================================

    const images = [
      'foto1.JPG',
      'foto2.JPG',
      'foto3.JPG',
      'foto4.JPG',
      'foto5.JPG',
      'foto6.JPG',
      'foto7.JPG',
      'foto8.HEIC'
    ];

    const carousel = document.getElementById('carousel');
    const dotsContainer = document.getElementById('dots');

    let currentIndex = 0;
    const slides = [];
    const dots = [];

    images.forEach((src, index) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';

      if (index === 0) {
        slide.classList.add('active');
      }

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Foto ${index + 1}`;
      img.loading = index < 2 ? 'eager' : 'lazy';
      img.decoding = 'async';

      slide.appendChild(img);
      carousel.appendChild(slide);
      slides.push(slide);

      const dot = document.createElement('div');
      dot.className = 'dot';

      if (index === 0) {
        dot.classList.add('active');
      }

      dotsContainer.appendChild(dot);
      dots.push(dot);
    });

    function nextSlide() {
      if (slides.length < 2) return;

      slides[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');

      currentIndex = (currentIndex + 1) % slides.length;

      slides[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    }

    // Troca a foto a cada 3,5 segundos.
    setInterval(nextSlide, 3500);


    // ==========================================
    // 2. CORAÇÕES FLUTUANTES
    // ==========================================

    const heartsContainer = document.getElementById('hearts');

    const heartSymbols = [
      '❤️', '💗', '💕', '💖', '♥', '💘', '💓'
    ];

    for (let i = 0; i < 32; i++) {
      const heart = document.createElement('span');

      heart.className = 'floating-heart';

      heart.textContent =
        heartSymbols[
          Math.floor(Math.random() * heartSymbols.length)
        ];

      heart.style.left = `${Math.random() * 100}%`;
      heart.style.fontSize = `${12 + Math.random() * 22}px`;
      heart.style.animationDuration = `${8 + Math.random() * 12}s`;
      heart.style.animationDelay = `${-Math.random() * 20}s`;

      heartsContainer.appendChild(heart);
    }


    // ==========================================
    // 3. MÚSICA LOCAL MP3
    // ==========================================

    const musica = document.getElementById('musica');
    const audioButton = document.getElementById('audio-button');
    const audioIcon = document.getElementById('audio-icon');

    let isPlaying = false;

    function updateAudioButton(playing) {
      isPlaying = playing;

      audioIcon.textContent = playing ? '🎵' : '🔇';

      audioButton.setAttribute(
        'aria-label',
        playing ? 'Pausar música' : 'Tocar música'
      );
    }

    // Atualiza o botão conforme o estado real do áudio.
    musica.addEventListener('play', () => {
      updateAudioButton(true);
    });

    musica.addEventListener('pause', () => {
      updateAudioButton(false);
    });

    musica.addEventListener('ended', () => {
      updateAudioButton(false);
    });

    // Tenta tocar automaticamente ao abrir a página.
    function tentarReproducaoAutomatica() {
      musica.play().then(() => {
        updateAudioButton(true);
      }).catch(() => {
        // O Safari pode bloquear o autoplay com som.
        // A música será tentada novamente no primeiro toque.
        updateAudioButton(false);
      });
    }

    // Tenta assim que o documento é carregado.
    tentarReproducaoAutomatica();

    // Se o navegador bloquear, tenta novamente no primeiro toque.
    // O listener é removido depois que a reprodução começa.
    function iniciarMusicaNoToque() {
      if (!musica.paused) return;

      musica.play().then(() => {
        updateAudioButton(true);
        document.removeEventListener(
          'pointerdown',
          iniciarMusicaNoToque
        );
      }).catch(() => {
        // Se ainda falhar, o botão de música continua disponível.
      });
    }

    document.addEventListener(
      'pointerdown',
      iniciarMusicaNoToque,
      { passive: true }
    );

    // O botão permite pausar ou iniciar manualmente.
    audioButton.addEventListener('click', () => {
      if (musica.paused) {
        musica.play().then(() => {
          updateAudioButton(true);

          document.removeEventListener(
            'pointerdown',
            iniciarMusicaNoToque
          );
        }).catch(() => {
          updateAudioButton(false);
        });
      } else {
        musica.pause();
        updateAudioButton(false);
      }
    });


    // ==========================================
    // 4. ONDA E EMOJI EM CADA TOQUE
    // ==========================================

    const cuteEmojis = [
      '🥰', '💗', '💖', '😘', '🐻',
      '💕', '🌸', '🐱', '🫶', '❤️',
      '✨', '💋', '🌷'
    ];

    let lastEffectTime = 0;

    function createTapEffect(x, y) {
      const now = performance.now();

      // Limita apenas toques extremamente rápidos.
      if (now - lastEffectTime < 65) return;

      lastEffectTime = now;

      // Onda circular.
      const wave = document.createElement('span');

      wave.className = 'tap-wave';
      wave.style.left = `${x}px`;
      wave.style.top = `${y}px`;

      document.body.appendChild(wave);

      wave.addEventListener('animationend', () => {
        wave.remove();
      }, { once: true });

      // Emoji aleatório.
      const emoji = document.createElement('span');

      emoji.className = 'tap-emoji';

      emoji.textContent =
        cuteEmojis[
          Math.floor(Math.random() * cuteEmojis.length)
        ];

      emoji.style.left =
        `${x + (Math.random() * 24 - 12)}px`;

      emoji.style.top =
        `${y + (Math.random() * 16 - 8)}px`;

      document.body.appendChild(emoji);

      emoji.addEventListener('animationend', () => {
        emoji.remove();
      }, { once: true });
    }

    // Funciona com toque no iPhone e clique no computador.
    // Os efeitos não bloqueiam os botões nem o carrossel.
    document.addEventListener('pointerdown', (event) => {
      if (
        event.pointerType === 'mouse' &&
        event.button !== 0
      ) {
        return;
      }

      createTapEffect(event.clientX, event.clientY);
    }, { passive: true });

  </script>

</body>
</html>
